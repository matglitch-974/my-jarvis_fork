<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyJarvis — Miku</title>
<style>
  :root {
    --glass: rgba(18, 28, 48, 0.55);
    --glass-border: rgba(120, 180, 255, 0.25);
    --accent: #6fd3ff;
    --text: #eaf2ff;
    --muted: #9db4d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: radial-gradient(1200px 800px at 20% 10%, #16305c 0%, #0a1226 45%, #060a16 100%);
    display: flex; align-items: center; justify-content: center;
  }
  /* réseau de bulles en fond (repli M2.2) */
  #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main {
    position: relative; z-index: 1;
    width: min(760px, 94vw); height: min(84vh, 900px);
    display: flex; flex-direction: column;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(120,180,255,.15);
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .4px; flex: 1; }
  header .sub { color: var(--muted); font-size: 12px; }
  /* gommette d'état M2.5 : vert écoute / jaune réflexion / rouge échec */
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #38e08a; transition: background .3s; box-shadow: 0 0 10px currentColor; }
  #dot.busy { background: #ffd056; }
  #dot.err  { background: #ff5d6c; }
  #log {
    flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin; scrollbar-color: rgba(120,180,255,.3) transparent;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: rgba(111,211,255,.16); border: 1px solid rgba(111,211,255,.25); }
  .miku { align-self: flex-start; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); }
  .miku.pending::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  form {
    display: flex; gap: 10px; padding: 14px 16px;
    border-top: 1px solid rgba(120,180,255,.15);
  }
  textarea {
    flex: 1; resize: none; height: 48px; padding: 12px 14px;
    background: rgba(255,255,255,.07); color: var(--text);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
    font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    padding: 0 22px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #3ea6ff, #6fd3ff); color: #04101f;
    font-weight: 600; font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <header>
    <div id="dot"></div>
    <h1>Miku <span class="sub">· MyJarvis v0.1 · mode Mythos</span></h1>
    <span class="sub" id="state">prête</span>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="in" placeholder="Parlez, Maître… (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne)"></textarea>
    <button id="send" type="submit">Envoyer</button>
  </form>
</main>
<script>
  // fond : réseau de points reliés, discret
  const cv = document.getElementById('bg'), cx = cv.getContext('2d');
  let pts = [];
  function resize() {
    cv.width = innerWidth; cv.height = innerHeight;
    pts = Array.from({length: 46}, () => ({
      x: Math.random()*cv.width, y: Math.random()*cv.height,
      vx: (Math.random()-.5)*.25, vy: (Math.random()-.5)*.25
    }));
  }
  addEventListener('resize', resize); resize();
  (function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x<0||p.x>cv.width) p.vx*=-1;
      if (p.y<0||p.y>cv.height) p.vy*=-1;
    }
    for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++) {
      const a=pts[i], b=pts[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if (d<170) { cx.strokeStyle=`rgba(110,180,255,${(1-d/170)*.18})`; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke(); }
    }
    for (const p of pts) { cx.fillStyle='rgba(140,200,255,.5)'; cx.beginPath(); cx.arc(p.x,p.y,1.6,0,7); cx.fill(); }
    requestAnimationFrame(tick);
  })();

  // chat
  const log = document.getElementById('log'), input = document.getElementById('in'),
        form = document.getElementById('f'), send = document.getElementById('send'),
        dot = document.getElementById('dot'), state = document.getElementById('state');

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }

  async function ask(message) {
    add('user', message);
    const bubble = add('miku pending', '');
    dot.className = 'busy'; state.textContent = 'réflexion…'; send.disabled = true;
    try {
      const r = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message })
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
          if (!line.startsWith('data:')) continue;
          const ev = JSON.parse(line.slice(5));
          if (ev.delta) { bubble.textContent += ev.delta; log.scrollTop = log.scrollHeight; }
          if (ev.error) throw new Error(ev.error);
        }
      }
      dot.className = ''; state.textContent = 'prête';
    } catch (e) {
      dot.className = 'err'; state.textContent = 'échec';
      bubble.textContent += '\n[erreur : ' + e.message + ']';
    } finally {
      bubble.classList.remove('pending'); send.disabled = false; input.focus();
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const m = input.value.trim();
    if (!m) return;
    input.value = ''; ask(m);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.focus();
</script>
</body>
</html>
